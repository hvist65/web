<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>create user | payflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <nav class="container">
            <div class="nav-brand">
                <img src="logo.jpg" alt="payflow logo" class="logo-img">
                <span class="brand-name">payflow</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link logout">logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="create-user-section">
            <div class="form-card">
                <h2>create new user</h2>
                <p class="subtitle">fill in the details to register a new client</p>

                <form action="users.html" class="standard-form">
                    <div class="form-group">
                        <label for="new-username">username</label>
                        <input type="text" id="new-username" placeholder="e.g. johndoe" required>
                    </div>

                    <div class="form-group">
                        <label for="new-email">email address</label>
                        <input type="email" id="new-email" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="new-role">account role</label>
                        <select id="new-role">
                            <option value="user">regular user</option>
                            <option value="admin">administrator</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">create account</button>
                        <a href="users.html" class="btn-cancel">back to list</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
