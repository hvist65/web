<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="login to payflow service">
    <title>login | payflow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="main-content">
        <section id="login-screen" class="auth-section">
            <div class="auth-card">
                <h1>login to payflow</h1>
                <div class="error-notification">
                    invalid username or password. please try again.
                </div>
                <form action="dashboard.html" class="auth-form">
                    <div class="form-group">
                        <label for="login-username">username</label>
                        <input type="text" id="login-username" name="username" class="input-error" required>
                        <span class="validation-msg">this field is required</span>
                    </div>
                    <div class="form-group">
                        <label for="login-password">password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary">login</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
